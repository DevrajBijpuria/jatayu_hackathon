[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "truthguard"
version = "0.1.0"
description = "TruthGuard — adversarial verification for multi-agent document Q&A"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=0.1",
    "langchain-core>=0.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "duckdb>=0.10",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = [
    "faiss-cpu>=1.7",
    "sentence-transformers>=3.0",
    "lingua-language-detector>=2.0",
    "pytesseract>=0.3",
]
nli = [
    "transformers>=4.40",
    "torch>=2.0",
]
sso = [
    "PyJWT[crypto]>=2.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["truthguard*", "eval*"]

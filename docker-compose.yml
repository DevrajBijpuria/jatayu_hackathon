version: "3.9"
# Keycloak for local SSO development (ENABLE_SSO=true).
# Start with: docker compose up keycloak
# See AGENTS.md §6 Phase 5 (SSO) for setup instructions.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8080:8080"
